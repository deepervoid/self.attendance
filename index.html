<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>self attendance</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--card:#0c0e13;--line:#1c2029;--tx:#eef1f6;--mu:#7c8494;--g:#12b34a;--r:#e5192d;--o:#ff7a12;--b:#2f6bff;--p:#7a5cff;--mono:"Share Tech Mono",ui-monospace,"Courier New",monospace;--cry:"Major Mono Display","Share Tech Mono",ui-monospace,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--mono);min-height:100%;text-transform:lowercase;overflow-x:hidden}
input,select,button,textarea{font-family:inherit;text-transform:lowercase}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
header{display:flex;align-items:center;gap:8px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5}
header h1{flex:1;font-family:var(--cry);font-size:18px;font-weight:400;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;font-size:22px;display:grid;place-items:center}
.ib:active{background:var(--line)}
#stage{position:relative;height:calc(min(60vh,430px) + 50px);margin-top:6px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.card{--w:min(72vw,300px);position:absolute;top:24px;left:50%;width:var(--w);margin-left:calc(var(--w) / -2);height:min(60vh,430px);transform-origin:50% calc(100% + 620px);background:linear-gradient(160deg,#15171c,#06070a 70%);border:1px solid #ffffff26;border-radius:26px;padding:18px 20px 20px;display:flex;flex-direction:column;box-shadow:0 20px 50px #000c;will-change:transform;overflow:hidden}
.card .nm{align-self:flex-end;text-align:right;font-family:var(--cry);font-size:17px;line-height:1.25;max-width:78%;word-break:break-word}
.card .em{flex:1;display:flex;align-items:center;justify-content:center;font-size:84px}
.pw{position:relative;width:max-content;font-size:50px;line-height:1;letter-spacing:-1px;margin-bottom:10px}
.pill{padding:11px 16px;border:1px solid var(--line);border-radius:20px;background:#0c0e13}
.chips .on{background:#eceff4!important;color:#000}
.bar{position:relative;height:10px;border-radius:6px;background:#1a1e27;margin:10px 0 8px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--g)}
.bar i.lo{background:var(--o)}
.bar u{position:absolute;top:-5px;bottom:-5px;width:2px;background:#fff;border-radius:2px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);gap:8px}
.q{display:flex;gap:8px;margin-top:16px}
.q button{flex:1;padding:11px;border-radius:14px;background:#161a22;font-size:14px}
.q button[data-q=present]{color:#4ee082}.q button[data-q=absent]{color:#ff5a68}
.empty{text-align:center;color:var(--mu);padding:30vh 30px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.nav button{padding:10px 18px;border:1px solid var(--g);border-radius:12px;background:#10151a}
.nav span{font-size:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);margin:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.cal div{min-height:60px;border:.5px solid var(--line);text-align:center;padding-top:8px;font-size:17px;position:relative}
.cal .h{min-height:0;padding:10px 0;font-size:13px;color:var(--mu)}
.cal small{display:block;color:var(--r);font-size:10px;font-weight:700;line-height:1.1;margin-top:3px}
.cal .today{outline:2px solid var(--b);outline-offset:-2px}
.cal .present{background:var(--g)}.cal .absent{background:var(--r)}.cal .half{background:var(--o)}
.cal [class*=leave]{background:var(--p)}
.cal .present small,.cal .absent small,.cal .half small,.cal [class*=leave] small{color:#fff}
.cal .nt::after{content:"";position:absolute;right:5px;top:5px;width:6px;height:6px;border-radius:50%;background:#ffd84a}
.panel{margin:12px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card)}
.panel select{background:#161a22;color:var(--tx);border:1px solid var(--g);border-radius:10px;padding:8px 10px;font:inherit;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;margin:14px 0;font-size:16px}
.grid2 b{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px}
.big{font-size:20px}
#ov{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
#ov.on{display:flex}
#sh{width:100%;background:#16191f;border-radius:22px 22px 0 0;padding:10px 8px calc(14px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
#sh h3{margin:10px 14px;font-size:15px;color:#6fd4c0;font-weight:600}
#sh button.row{display:flex;width:100%;gap:14px;align-items:center;text-align:left;padding:15px 14px;font-size:18px;border-radius:12px}
#sh button.row:active{background:#232830}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 10px}
.chips button{padding:10px 14px;border-radius:12px;background:#232830;font-size:15px}
#sh input{width:calc(100% - 28px);margin:6px 14px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#0c0e13;color:var(--tx);font:inherit}
.pri{background:var(--g)!important;color:#000!important;font-weight:600;justify-content:center}
.foot{text-align:center;color:var(--mu);font-size:12px;padding:6px 20px 20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="ov"><div id="sh"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s), pad=n=>String(n).padStart(2,'0');
const LBL={present:'Present',absent:'Absent',half:'Half Day',holiday:'Holiday',off:'Weekly Off','leave-privileged':'Privileged leave','leave-casual':'Casual leave','leave-sick':'Sick leave','leave-other':'Other leave'};
const SHORT={holiday:'Holiday',off:'Weekly Off'};
let S={}, cur=null, ym=new Date(), scope='month', dir=null, backend='';

/* ---------- storage: OPFS (real files) with IndexedDB fallback ---------- */
const idb=()=>new Promise((r,j)=>{const q=indexedDB.open('att',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>r(q.result);q.onerror=j});
const idbDo=async f=>{const d=await idb();return new Promise((r,j)=>{const t=d.transaction('f','readwrite');f(t.objectStore('f'));t.oncomplete=r;t.onerror=j})};
async function idbAll(){const d=await idb();return new Promise(r=>{const o={};const q=d.transaction('f').objectStore('f').openCursor();q.onsuccess=()=>{const c=q.result;if(c){o[c.key]=c.value;c.continue()}else r(o)}})}
async function initStore(){
  try{
    const r=await navigator.storage.getDirectory(), d=await r.getDirectoryHandle('attendance',{create:true});
    const h=await d.getFileHandle('.probe',{create:true}), w=await h.createWritable(); await w.write('1'); await w.close();
    dir=d; backend='device files (.md)'; navigator.storage.persist&&navigator.storage.persist();
  }catch(e){dir=null;backend='device storage (indexeddb)'}
}
async function listFiles(){
  if(!dir){const a=await idbAll(),o={};for(const k in a)if(k.endsWith('.md'))o[k]=a[k];return o}
  const o={}; for await(const [n,h] of dir.entries()) if(n.endsWith('.md')) o[n]=await (await h.getFile()).text(); return o;
}
async function writeFile(n,t){
  mirror(n,t);
  if(!dir)return idbDo(s=>s.put(t,n));
  const h=await dir.getFileHandle(n,{create:true}), w=await h.createWritable(); await w.write(t); await w.close();
}
async function delFile(n){ if(!dir)return idbDo(s=>s.delete(n)); await dir.removeEntry(n).catch(()=>{}); }

/* ---------- optional: mirror to a real folder (desktop chrome/edge) + import ---------- */
let ext=null;
async function initExt(){try{const d=await idb();ext=await new Promise(r=>{const q=d.transaction('f').objectStore('f').get('__dir');q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){}}
async function mirror(n,t){if(!ext)return;try{const h=await ext.getFileHandle(n,{create:true}),w=await h.createWritable();await w.write(t);await w.close()}catch(e){}}
async function linkFolder(){
  if(!window.showDirectoryPicker)return alert('this browser cannot link a folder (android browsers cannot). use download all .md and import instead.');
  try{
    if(ext&&await ext.requestPermission({mode:'readwrite'})=='granted'){}
    else{ext=await showDirectoryPicker({mode:'readwrite'});await idbDo(s=>s.put(ext,'__dir'))}
  }catch(e){return}
  for(const o of Object.values(S))await mirror(o.file,ser(o));
  alert('folder synced. every change now also saves there.');
}
function importMd(){
  const i=document.createElement('input');i.type='file';i.multiple=true;
  i.onchange=async()=>{for(const f of i.files){const n=f.name.endsWith('.md')?f.name:f.name+'.md',o=parse(await f.text(),n);S[n]=o;await save(o)}close();home()};
  i.click();
}

/* ---------- md format ---------- */
function parse(txt,file){
  const o={file,name:file.replace('.md',''),emoji:'📘',target:75,days:{}};
  const m=txt.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/); if(!m)return o;
  m[1].split('\n').forEach(l=>{const i=l.indexOf(':');if(i<0)return;const k=l.slice(0,i).trim(),v=l.slice(i+1).trim();if(k=='target')o.target=+v||75;else if(k=='name'||k=='emoji')o[k]=v});
  m[2].split('\n').forEach(l=>{const p=l.split('|').map(x=>x.trim());if(/^\d{4}-\d\d-\d\d$/.test(p[0]))o.days[p[0]]={s:p[1]||'',n:p.slice(2).join(' | ')}});
  return o;
}
const ser=o=>`---\nname: ${o.name}\nemoji: ${o.emoji}\ntarget: ${o.target}\n---\n`+Object.keys(o.days).sort().filter(k=>o.days[k].s||o.days[k].n).map(k=>`${k} | ${o.days[k].s}${o.days[k].n?' | '+o.days[k].n.replace(/\n/g,' '):''}`).join('\n')+'\n';
const save=o=>writeFile(o.file,ser(o));

/* ---------- maths ---------- */
const key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`;
const today=()=>{const t=new Date();return key(t.getFullYear(),t.getMonth(),t.getDate())};
function stats(o,pre){
  const c={present:0,absent:0,half:0,leave:0,holiday:0,off:0};
  for(const k in o.days){if(pre&&!k.startsWith(pre))continue;const s=o.days[k].s;if(!s)continue;if(s.startsWith('leave'))c.leave++;else c[s]++}
  c.T=c.present+c.half+c.absent+c.leave; c.A=c.present+c.half*.5; c.pct=c.T?Math.round(c.A/c.T*100):0; return c;
}
function hint(o){
  const c=stats(o),t=o.target/100; if(!c.T)return'no classes yet';
  if(c.A/c.T>=t){const n=t>0?Math.floor(c.A/t-c.T+1e-9):0;return n>0?`can skip ${n} more`:'right on target'}
  if(t>=1)return'below target';
  return `attend next ${Math.ceil((t*c.T-c.A)/(1-t)-1e-9)}`;
}

/* ---------- ui helpers ---------- */
function sheet(h){$('#sh').innerHTML=h;$('#ov').classList.add('on')}
function close(){$('#ov').classList.remove('on')}
$('#ov').addEventListener('click',e=>{if(e.target.id=='ov')close()});
function dl(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- home: card wheel ---------- */
let pos=0,raf=0,drag=null,wt=0;
function wheelUpdate(){
  const cs=document.querySelectorAll('.card'),n=cs.length;
  cs.forEach((el,i)=>{
    let off=((i-pos)%n+n)%n; if(off>n/2)off-=n;
    const a=Math.abs(off); let op=Math.min(1,3.4-a); if(n>2)op=Math.min(op,(n/2-a)*2);
    op=Math.max(0,op)*(1-Math.min(a,3)*.18);
    el.style.transform=`rotate(${off*11}deg) scale(${1-Math.min(a,4)*.035})`;
    el.style.opacity=op; el.style.zIndex=100-Math.round(a*10);
    el.style.filter=`brightness(${1-Math.min(a,3)*.2})`; el.style.pointerEvents=op>.05?'auto':'none';
  });
}
function spin(to){
  cancelAnimationFrame(raf);const from=pos,t0=performance.now(),dur=Math.min(750,260+Math.abs(to-from)*120);
  const step=t=>{let k=Math.min(1,(t-t0)/dur);k=1-Math.pow(1-k,3);pos=from+(to-from)*k;wheelUpdate();if(k<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function bindStage(){
  const st=$('#stage'),n=Object.keys(S).length;
  st.onpointerdown=e=>{cancelAnimationFrame(raf);drag={x:e.clientX,p:pos,lx:e.clientX,lt:performance.now(),v:0,m:false,t:e.target}};
  st.onpointermove=e=>{if(!drag)return;const dx=e.clientX-drag.x;
    if(!drag.m&&Math.abs(dx)>6){drag.m=true;st.setPointerCapture(e.pointerId)}
    if(drag.m){pos=drag.p-dx/130;const t=performance.now();drag.v=(e.clientX-drag.lx)/Math.max(1,t-drag.lt)*.6+drag.v*.4;drag.lx=e.clientX;drag.lt=t;wheelUpdate()}};
  st.onpointerup=()=>{const d=drag;drag=null;if(!d)return;
    if(d.m){spin(Math.round(pos-d.v*2));return}
    if(d.t.closest('button'))return;const c=d.t.closest('.card');if(!c)return;
    let off=((+c.dataset.i-pos)%n+n)%n;if(off>n/2)off-=n;
    Math.abs(off)<.5?openSubject(c.dataset.f):spin(Math.round(pos+off))};
  st.onpointercancel=()=>{if(drag&&drag.m)spin(Math.round(pos));drag=null};
  st.addEventListener('wheel',e=>{e.preventDefault();cancelAnimationFrame(raf);pos+=(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY)/260;wheelUpdate();clearTimeout(wt);wt=setTimeout(()=>spin(Math.round(pos)),130)},{passive:false});
}
function home(){
  cur=null; const list=Object.values(S).sort((a,b)=>a.name.localeCompare(b.name)),n=list.length; pos=n?((Math.round(pos)%n)+n)%n:0;
  $('#app').innerHTML=`<header><h1>self attendance</h1><button class="ib" data-a="add">＋</button><button class="ib" data-a="menu">⋮</button></header>`+
  (n?`<div id="stage">${list.map((o,i)=>{const c=stats(o),ok=c.pct>=o.target;return `<div class="card" data-i="${i}" data-f="${esc(o.file)}"><div class="nm">${esc(o.name)}</div><div class="em">${esc(o.emoji)}</div><div class="pw" style="left:${c.pct}%;transform:translateX(-${c.pct}%)">${c.pct}%</div><div class="bar"><i class="${ok?'':'lo'}" style="width:${c.pct}%"></i><u style="left:calc(${o.target}% - 1px)"></u></div><div class="meta"><span>target ${o.target}%</span><span>${hint(o)}</span></div><div class="q"><button data-q="present">present today</button><button data-q="absent">absent today</button></div></div>`}).join('')}</div>`
  :`<div class="empty">no subjects yet.<br>tap ＋ to add your first one.</div>`)+`<div class="foot">saved on this device · ${backend}</div>`;
  if(n){wheelUpdate();bindStage()}
}
function openSubject(f){cur=S[f];ym=new Date();history.pushState({s:1},'');subject()}
window.addEventListener('popstate',()=>{if(cur){cur=null;close();home()}else close()});

/* recurring days off */
let bulk={wd:0,occ:new Set(['all']),as:'off',span:'month'};
function bulkSheet(){
  const ch=(a,v,t,on)=>`<button data-a="${a}" data-v="${v}" class="${on?'on':''}">${t}</button>`;
  sheet(`<h3>recurring days off</h3><h3>day</h3><div class="chips">${['sun','mon','tue','wed','thu','fri','sat'].map((t,i)=>ch('bwd',i,t,bulk.wd==i)).join('')}</div>
  <h3>which ones</h3><div class="chips">${[['all','every'],['1','1st'],['2','2nd'],['3','3rd'],['4','4th'],['5','5th'],['last','last']].map(([v,t])=>ch('bocc',v,t,bulk.occ.has(v))).join('')}</div>
  <h3>mark as</h3><div class="chips">${ch('bas','holiday','holiday',bulk.as=='holiday')}${ch('bas','off','weekly off',bulk.as=='off')}</div>
  <h3>apply to</h3><div class="chips">${ch('bspan','month','this month',bulk.span=='month')}${ch('bspan','year','whole year',bulk.span=='year')}</div>
  <div class="chips"><button class="row pri" style="width:100%" data-a="bapply">apply</button></div>`);
}
function applyBulk(){
  const y=ym.getFullYear(),months=bulk.span=='year'?[...Array(12).keys()]:[ym.getMonth()];
  months.forEach(m=>{const n=new Date(y,m+1,0).getDate(),days=[];
    for(let d=1;d<=n;d++)if(new Date(y,m,d).getDay()==bulk.wd)days.push(d);
    days.forEach((d,i)=>{if(bulk.occ.has('all')||bulk.occ.has(String(i+1))||(bulk.occ.has('last')&&i==days.length-1)){
      const k=key(y,m,d),r=cur.days[k]||{s:'',n:''};if(!r.s||r.s=='holiday'||r.s=='off'){r.s=bulk.as;cur.days[k]=r}}})});
  save(cur);close();subject();
}

/* ---------- subject ---------- */
function subject(){
  const o=cur,y=ym.getFullYear(),m=ym.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),t=today();
  const mn=ym.toLocaleString('en',{month:'short'})+" "+y;
  let cells=['SUN','MON','TUE','WED','THU','FRI','SAT'].map(d=>`<div class="h">${d}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){const k=key(y,m,d),r=o.days[k]||{},s=r.s||'';
    cells+=`<div data-d="${k}" class="${s} ${k==t?'today':''} ${r.n?'nt':''}">${d}${s&&!['present','absent','half'].includes(s)?`<small>${s.startsWith('leave')?'Leave':SHORT[s]}</small>`:''}</div>`}
  const c=stats(o,scope=='month'?`${y}-${pad(m+1)}`:''),ok=c.pct>=o.target;
  $('#app').innerHTML=`<header><button class="ib" data-a="back">←</button><h1>${esc(o.name)} ${esc(o.emoji)}</h1><button class="ib" data-a="smenu">⋮</button></header>
  <div class="nav"><button data-a="prev">‹ PREV</button><span>${mn}</span><button data-a="next">NEXT ›</button></div>
  <div class="cal">${cells}</div>
  <div class="panel"><select data-a="scope"><option value="month" ${scope=='month'?'selected':''}>Attendance for this month</option><option value="all" ${scope=='all'?'selected':''}>Attendance for all months</option></select>
  <div class="grid2"><div><b style="background:var(--g)"></b>Present : ${c.present}</div><div><b style="background:var(--r)"></b>Absent : ${c.absent}</div><div><b style="background:var(--o)"></b>Half Days : ${c.half}</div><div><b style="background:var(--p)"></b>Leaves : ${c.leave}</div><div>Holidays : ${c.holiday}</div><div>Weekly Off : ${c.off}</div></div>
  <div class="big">Percentage : <b style="color:${ok?'#4ee082':'#ff9a4d'}">${c.pct}%</b> <span style="color:var(--mu);font-size:14px">/ target ${o.target}%</span></div>
  <div class="bar" style="margin-top:12px"><i class="${ok?'':'lo'}" style="width:${c.pct}%"></i><u style="left:calc(${o.target}% - 1px)"></u></div>
  <div class="meta"><span>${hint(o)}</span></div></div><div class="foot"><button class="pill" data-a="bulk">＋ mark recurring days off</button></div>`;
}
function daySheet(k){
  const r=cur.days[k]||{s:'',n:''};
  sheet(`<h3>${k}</h3>
  <button class="row" data-s="present"><span style="color:#4ee082">✔</span>Present</button>
  <button class="row" data-s="absent"><span style="color:#ff5a68">✕</span>Absent</button>
  <button class="row" data-s="half"><span style="color:var(--o)">◐</span>Half Day</button>
  <button class="row" data-s="holiday"><span style="color:var(--r)">⌂</span>Holiday</button>
  <button class="row" data-s="off"><span style="color:var(--r)">⊘</span>Weekly Off</button>
  <h3>Leave</h3><div class="chips">${['privileged','casual','sick','other'].map(x=>`<button data-s="leave-${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>
  <button class="row" data-s="__note"><span style="color:#ffd84a">✎</span>Note${r.n?': '+esc(r.n.slice(0,24)):''}</button>
  <button class="row" data-s=""><span style="color:var(--mu)">☐</span>Clear</button>`);
  $('#sh').dataset.k=k;
}
function setDay(k,s){
  const r=cur.days[k]||{s:'',n:''};
  if(s=='__note'){const v=prompt('note for '+k,r.n);if(v===null)return;r.n=v}else r.s=s;
  cur.days[k]=r; save(cur); close(); subject();
}
function formSheet(o){
  sheet(`<h3>${o?'Edit subject':'New subject'}</h3><input id="f1" placeholder="Subject name" value="${o?esc(o.name):''}"><input id="f2" placeholder="Emoji" value="${o?esc(o.emoji):'📘'}"><input id="f3" type="number" min="1" max="100" placeholder="Target attendance %" value="${o?o.target:75}"><div class="chips"><button class="row pri" style="width:100%" data-a="saveform" data-e="${o?1:0}">Save</button></div>`);
}
async function saveForm(edit){
  const name=$('#f1').value.trim().toLowerCase(); if(!name)return;
  const emoji=$('#f2').value.trim()||'📘', target=Math.min(100,Math.max(1,+$('#f3').value||75));
  if(edit){Object.assign(cur,{name,emoji,target})}
  else{const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'subject';let f=id+'.md',i=2;while(S[f])f=id+'-'+(i++)+'.md';cur={file:f,name,emoji,target,days:{}};S[f]=cur}
  await save(cur); close(); edit?subject():home();
}
function exportX(){
  if(!window.XLSX)return alert('excel library failed to load. connect to the internet once and retry.');
  const wb=XLSX.utils.book_new(),sum=[['subject','target %','present','half days','absent','leaves','attendance %','status']];
  Object.values(S).forEach(o=>{const c=stats(o);sum.push([o.name,o.target,c.present,c.half,c.absent,c.leave,c.pct,c.pct>=o.target?'on target':'below target'])});
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'summary');
  Object.values(S).forEach((o,i)=>{const rows=[['date','status','note']];Object.keys(o.days).sort().forEach(k=>rows.push([k,(LBL[o.days[k].s]||'').toLowerCase(),o.days[k].n]));
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),(i+1+' '+o.name).replace(/[\\\/?*\[\]:]/g,'').slice(0,31))});
  XLSX.writeFile(wb,'attendance_'+today()+'.xlsx');
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a],[data-q],[data-d],[data-s]'); if(!t)return;
  const a=t.dataset.a;
  if(t.dataset.q!==undefined){const o=S[t.closest('.card').dataset.f];o.days[today()]={s:t.dataset.q,n:(o.days[today()]||{}).n||''};await save(o);home();return}
  if(t.dataset.s!==undefined){setDay($('#sh').dataset.k,t.dataset.s);return}
  if(t.dataset.d){daySheet(t.dataset.d);return}
  if(a=='add')cur=null,formSheet(null);
  else if(a=='saveform')saveForm(t.dataset.e=='1');
  else if(a=='menu')sheet(`<h3>Menu</h3><button class="row" data-a="xl">⬇ Export to Excel</button><button class="row" data-a="allmd">⬇ Download all .md files</button><button class="row" data-a="imp">⬆ Import .md files</button><button class="row" data-a="folder">📁 Sync to a folder (desktop)</button>`);
  else if(a=='imp'){close();importMd()}
  else if(a=='folder'){close();linkFolder()}
  else if(a=='xl'){close();exportX()}
  else if(a=='allmd'){close();Object.values(S).forEach(o=>dl(o.file,new Blob([ser(o)],{type:'text/markdown'})))}
  else if(a=='back')history.back();
  else if(a=='bulk'){close();bulkSheet()}
  else if(a=='bwd'){bulk.wd=+t.dataset.v;bulkSheet()}
  else if(a=='bocc'){const v=t.dataset.v;if(v=='all')bulk.occ=new Set(['all']);else{bulk.occ.delete('all');bulk.occ.has(v)?bulk.occ.delete(v):bulk.occ.add(v);if(!bulk.occ.size)bulk.occ.add('all')}bulkSheet()}
  else if(a=='bas'){bulk.as=t.dataset.v;bulkSheet()}
  else if(a=='bspan'){bulk.span=t.dataset.v;bulkSheet()}
  else if(a=='bapply')applyBulk();
  else if(a=='prev'){ym=new Date(ym.getFullYear(),ym.getMonth()-1,1);subject()}
  else if(a=='next'){ym=new Date(ym.getFullYear(),ym.getMonth()+1,1);subject()}
  else if(a=='smenu')sheet(`<h3>${esc(cur.name)}</h3><button class="row" data-a="bulk">▦ mark recurring days off</button><button class="row" data-a="edit">✎ Edit name / target</button><button class="row" data-a="md">⬇ Download .md</button><button class="row" data-a="del" style="color:#ff5a68">🗑 Delete subject</button>`);
  else if(a=='edit')formSheet(cur);
  else if(a=='md'){close();dl(cur.file,new Blob([ser(cur)],{type:'text/markdown'}))}
  else if(a=='del'){if(confirm('delete '+cur.name+' and all its attendance?')){await delFile(cur.file);delete S[cur.file];close();history.back()}}
});
document.addEventListener('change',e=>{if(e.target.dataset.a=='scope'){scope=e.target.value;subject()}});

history.replaceState({h:1},'');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{await initStore();await initExt();const f=await listFiles();for(const n in f)S[n]=parse(f[n],n);home()})();
</script>
</body>
